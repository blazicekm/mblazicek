<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matúš Blažíček — Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f5f5;
        }

        #viewer {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading {
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div id="viewer">
        <div class="loading">Loading portfolio</div>
    </div>

</body>
</html>
