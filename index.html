<!DOCTYPE html>
<html lang="sk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Matúš Blažíček — Architect</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #ffffff;

            color: #111111;

        }


        .page {

            width: 100%;

            height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .content {

            text-align: center;

        }


        h1 {

            margin: 0;

            font-size:
                clamp(
                    42px,
                    6vw,
                    90px
                );

            font-weight: 400;

            letter-spacing:
                -0.04em;

            line-height: 1;

        }


        .profession {

            margin-top: 20px;

            font-size: 19px;

            font-weight: 400;

            letter-spacing:
                0.24em;

            line-height: 1;

        }


        .portfolio {

            display: inline-block;

            margin-top: 52px;

            color: #111111;

            text-decoration: none;

            font-size: 16px;

            font-weight: 400;

            letter-spacing:
                0.20em;

            line-height: 1;

        }


        .portfolio:hover {

            opacity: 0.45;

        }


        @media (
            max-width: 600px
        ) {

            .profession {

                font-size: 16px;

                letter-spacing:
                    0.20em;

            }


            .portfolio {

                font-size: 14px;

                letter-spacing:
                    0.16em;

                margin-top: 44px;

            }

        }

    </style>

</head>


<body>


    <div class="page">

        <main class="content">


            <h1>

                Matúš Blažíček

            </h1>


            <div class="profession">

                ARCHITECT

            </div>


            <a
                class="portfolio"
                href="viewer/viewer.html"
            >

                PORTFOLIO &amp; CV

            </a>


        </main>

    </div>


</body>

</html>
