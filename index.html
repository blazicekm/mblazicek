<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maty — Architect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        main {
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 48px;
            font-weight: 400;
        }

        p {
            margin: 0 0 40px;
            font-size: 16px;
        }

        a {
            display: inline-block;
            margin: 0 8px;
            padding: 14px 24px;
            border: 1px solid #111111;
            color: #111111;
            text-decoration: none;
            transition: 0.2s;
        }

        a:hover {
            background: #111111;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <main>
        <h1>Maty</h1>
        <p>Architect</p>

        <a href="portfolio.pdf">Portfolio</a>
        <a href="cv.pdf">CV</a>
    </main>

</body>
</html>
