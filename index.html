<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matúš Blažíček — Architect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        .page {
            min-height: 100vh;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .name {
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        nav {
            display: flex;
            gap: 24px;
        }

        nav a {
            color: #111111;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            opacity: 0.5;
        }

        main {
            margin-bottom: 8vh;
        }

        h1 {
            margin: 0;
            font-size: clamp(48px, 8vw, 120px);
            font-weight: 400;
            letter-spacing: -0.04em;
            line-height: 0.95;
        }

        .subtitle {
            margin-top: 24px;
            font-size: 16px;
            letter-spacing: 0.02em;
        }

        footer {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666666;
        }

        @media (max-width: 600px) {
            .page {
                padding: 20px;
            }

            header {
                align-items: flex-start;
            }

            nav {
                gap: 14px;
                flex-direction: column;
                align-items: flex-end;
            }

            h1 {
                font-size: 64px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <header>
            <div class="name">MATY</div>

            <nav>
                <a href="portfolio.pdf">PORTFOLIO</a>
                <a href="cv.pdf">CV</a>
            </nav>
        </header>

        <main>
            <h1>ARCHITECT</h1>
            <div class="subtitle">Architecture · Design · Research</div>
        </main>

        <footer>
            <span>© 2026</span>
            <span>Slovakia</span>
        </footer>

    </div>

</body>
</html>
