<!DOCTYPE html>
<html lang="sk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Matúš Blažíček — Architect</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #ffffff;

            color: #111111;

        }


        .page {

            width: 100%;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 24px;

        }


        .content {

            text-align: center;

        }


        /*
         * NAME
         */

        h1 {

            margin: 0;

            font-size:
                clamp(
                    42px,
                    6vw,
                    90px
                );

            font-weight: 400;

            letter-spacing:
                -0.04em;

            line-height: 1;

        }


        /*
         * PROFESSION
         */

        .profession {

            margin-top: 20px;

            font-size: 19px;

            font-weight: 400;

            letter-spacing:
                0.24em;

            line-height: 1;

        }


        /*
         * PORTFOLIO
         */

        .portfolio {

            display: inline-block;

            margin-top: 52px;

            color: #111111;

            text-decoration: none;

            font-size: 16px;

            font-weight: 400;

            letter-spacing:
                0.20em;

            line-height: 1;

        }


        .portfolio:hover {

            opacity: 0.45;

        }


        /*
         * CONTACT
         */

        .contact {

            margin-top: 48px;

            display: flex;

            flex-direction: column;

            gap: 9px;

        }


        .contact a {

            color: #111111;

            text-decoration: none;

            font-size: 14px;

            font-weight: 400;

            letter-spacing:
                0.03em;

            line-height: 1.4;

        }


        .contact a:hover {

            opacity: 0.45;

        }


        /*
         * MOBILE
         */

        @media (
            max-width: 600px
        ) {

            .page {

                padding:
                    32px 20px;

            }


            .profession {

                font-size: 16px;

                letter-spacing:
                    0.20em;

            }


            .portfolio {

                font-size: 14px;

                letter-spacing:
                    0.16em;

                margin-top: 44px;

            }


            .contact {

                margin-top: 40px;

            }


            .contact a {

                font-size: 13px;

            }

        }

    </style>

</head>


<body>


    <div class="page">

        <main class="content">


            <h1>

                Matúš Blažíček

            </h1>


            <div class="profession">

                ARCHITECT

            </div>


            <a
                class="portfolio"
                href="/portfolio/"
            >

                PORTFOLIO &amp; CV

            </a>


            <div class="contact">


                <a
                    href="tel:+421948023347"
                >

                    +421 948 023 347

                </a>


                <a
                    href="mailto:matusblazicek@gmail.com"
                >

                    matusblazicek@gmail.com

                </a>


            </div>


        </main>

    </div>


</body>

</html>
