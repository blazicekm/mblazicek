<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matúš Blažíček — Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #eeeeee;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #book {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            max-width: 96vw;
            max-height: 94vh;
        }

        .page {
            position: relative;
            background: white;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .page canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .page.single {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .page.left {
            box-shadow:
                -3px 8px 30px rgba(0, 0, 0, 0.10),
                inset -8px 0 15px -15px rgba(0, 0, 0, 0.35);
        }

        .page.right {
            box-shadow:
                3px 8px 30px rgba(0, 0, 0, 0.10),
                inset 8px 0 15px -15px rgba(0, 0, 0, 0.35);
        }

        .annotation-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .annotation-layer a {
            position: absolute;
            pointer-events: auto;
            display: block;
            background: transparent;
        }

        .annotation-layer a:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        #controls {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 18px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #333;
            z-index: 100;
        }

        #controls button {
            border: 0;
            background: transparent;
            color: inherit;
            cursor: pointer;
            font: inherit;
            padding: 5px;
        }

        #controls button:hover {
            opacity: 0.45;
        }

        #pageNumber {
            min-width: 70px;
            text-align: center;
        }

        #loading {
            position: fixed;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @media (max-width: 700px) {
            #book {
                max-width: 94vw;
                max-height: 88vh;
            }

            #controls {
                bottom: 12px;
            }
        }
    </style>
</head>

<body>

    <div id="loading">Loading portfolio</div>

    <div id="book"></div>

    <div id="controls">
        <button id="previous">←</button>
        <span id="pageNumber">1 / 50</span>
        <button id="next">→</button>
    </div>

   <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
    const PDF_URL = "../portfolio.pdf";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const loading = document.getElementById("loading");
    const book = document.getElementById("book");

    async function loadPDF() {

        try {

            const pdf = await pdfjsLib.getDocument(PDF_URL).promise;

            loading.textContent =
                "PDF loaded — " + pdf.numPages + " pages";

            console.log("PDF loaded:", pdf.numPages);

        } catch (error) {

            loading.textContent =
                "ERROR: " + error.message;

            console.error(error);

        }

    }

    loadPDF();
</script>

</body>
</html>
