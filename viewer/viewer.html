<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matúš Blažíček — Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #eeeeee;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #book {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            max-width: 96vw;
            max-height: 94vh;
        }

        .page {
            position: relative;
            background: white;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .page canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .page.single {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .page.left {
            box-shadow:
                -3px 8px 30px rgba(0, 0, 0, 0.10),
                inset -8px 0 15px -15px rgba(0, 0, 0, 0.35);
        }

        .page.right {
            box-shadow:
                3px 8px 30px rgba(0, 0, 0, 0.10),
                inset 8px 0 15px -15px rgba(0, 0, 0, 0.35);
        }

        .annotation-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .annotation-layer a {
            position: absolute;
            pointer-events: auto;
            display: block;
            background: transparent;
        }

        .annotation-layer a:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        #controls {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 18px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #333;
            z-index: 100;
        }

        #controls button {
            border: 0;
            background: transparent;
            color: inherit;
            cursor: pointer;
            font: inherit;
            padding: 5px;
        }

        #controls button:hover {
            opacity: 0.45;
        }

        #pageNumber {
            min-width: 70px;
            text-align: center;
        }

        #loading {
            position: fixed;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @media (max-width: 700px) {
            #book {
                max-width: 94vw;
                max-height: 88vh;
            }

            #controls {
                bottom: 12px;
            }
        }
    </style>
</head>

<body>

    <div id="loading">Loading portfolio</div>

    <div id="book"></div>

    <div id="controls">
        <button id="previous">←</button>
        <span id="pageNumber">1 / 50</span>
        <button id="next">→</button>
    </div>

    <script type="module">

        import {
            getDocument
        } from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

        const PDF_URL = "../portfolio.pdf";

        const loading = document.getElementById("loading");
        const book = document.getElementById("book");
        const pageNumber = document.getElementById("pageNumber");

        let pdf;
        let current = 1;

        async function loadPDF() {

            pdf = await getDocument({
                url: PDF_URL
            }).promise;

            loading.remove();

            await showPages();

        }

        function pageSet() {

            if (current === 1) {
                return [1];
            }

            if (current >= 50) {
                return [50];
            }

            return [current, current + 1];

        }

        async function renderPage(pageNumberValue, position) {

            const pdfPage = await pdf.getPage(pageNumberValue);

            const viewport = pdfPage.getViewport({
                scale: 1
            });

            const availableWidth =
                window.innerWidth * 0.46;

            const availableHeight =
                window.innerHeight * 0.90;

            const scale = Math.min(
                availableWidth / viewport.width,
                availableHeight / viewport.height
            );

            const scaledViewport =
                pdfPage.getViewport({
                    scale
                });

            const pageElement =
                document.createElement("div");

            pageElement.className =
                "page " + position;

            pageElement.style.width =
                scaledViewport.width + "px";

            pageElement.style.height =
                scaledViewport.height + "px";

            const canvas =
                document.createElement("canvas");

            const context =
                canvas.getContext("2d");

            canvas.width =
                scaledViewport.width;

            canvas.height =
                scaledViewport.height;

            pageElement.appendChild(canvas);

            const annotationLayer =
                document.createElement("div");

            annotationLayer.className =
                "annotation-layer";

            pageElement.appendChild(
                annotationLayer
            );

            await pdfPage.render({
                canvasContext: context,
                viewport: scaledViewport
            }).promise;

            const annotations =
                await pdfPage.getAnnotations();

            annotations.forEach(annotation => {

                if (annotation.subtype !== "Link") {
                    return;
                }

                const link =
                    document.createElement("a");

                const rect =
                    annotation.rect;

                const x =
                    rect[0] * scale;

                const y =
                    scaledViewport.height -
                    rect[3] * scale;

                const width =
                    (rect[2] - rect[0]) * scale;

                const height =
                    (rect[3] - rect[1]) * scale;

                link.style.left = x + "px";
                link.style.top = y + "px";
                link.style.width = width + "px";
                link.style.height = height + "px";

                if (annotation.url) {

                    link.href =
                        annotation.url;

                    link.target = "_blank";

                } else if (
                    annotation.dest
                ) {

                    link.href = "#";

                    link.addEventListener(
                        "click",
                        async event => {

                            event.preventDefault();

                            const destination =
                                await pdf.getDestination(
                                    annotation.dest
                                );

                            if (!destination) {
                                return;
                            }

                            const pageIndex =
                                await pdf.getPageIndex(
                                    destination[0]
                                );

                            const targetPage =
                                pageIndex + 1;

                            if (targetPage === 1) {
                                current = 1;
                            } else if (
                                targetPage === 50
                            ) {
                                current = 50;
                            } else if (
                                targetPage % 2 === 0
                            ) {
                                current = targetPage;
                            } else {
                                current = targetPage - 1;
                            }

                            await showPages();

                        }
                    );
                }

                annotationLayer.appendChild(link);

            });

            return pageElement;
        }

        async function showPages() {

            book.innerHTML = "";

            const pages =
                pageSet();

            for (
                let i = 0;
                i < pages.length;
                i++
            ) {

                const position =
                    pages.length === 1
                        ? "single"
                        : i === 0
                            ? "left"
                            : "right";

                const element =
                    await renderPage(
                        pages[i],
                        position
                    );

                book.appendChild(element);
            }

            pageNumber.textContent =
                pages.length === 1
                    ? `${pages[0]} / 50`
                    : `${pages[0]}–${pages[1]} / 50`;

        }

        document
            .getElementById("next")
            .addEventListener(
                "click",
                async () => {

                    if (current === 1) {
                        current = 2;
                    } else if (
                        current < 48
                    ) {
                        current += 2;
                    } else {
                        current = 50;
                    }

                    await showPages();

                }
            );

        document
            .getElementById("previous")
            .addEventListener(
                "click",
                async () => {

                    if (current === 50) {
                        current = 48;
                    } else if (
                        current > 2
                    ) {
                        current -= 2;
                    } else {
                        current = 1;
                    }

                    await showPages();

                }
            );

        document.addEventListener(
            "keydown",
            async event => {

                if (event.key === "ArrowRight") {
                    document
                        .getElementById("next")
                        .click();
                }

                if (event.key === "ArrowLeft") {
                    document
                        .getElementById("previous")
                        .click();
                }

            }
        );

        loadPDF();

    </script>

</body>
</html>
