<!DOCTYPE html>
<html lang="sk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    >

    <title>Matúš Blažíček — Portfolio</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #f7f7f7;

        }


        body {

            display: flex;

            align-items: center;
            justify-content: center;

            touch-action: none;

        }


        #book {

            position: relative;

            width: 92vw;
            height: 88vh;

            display: flex;

            align-items: center;
            justify-content: center;

            transform-origin: center center;

        }


        #book-shell {

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: visible;

        }


        .spread {

            position: relative;

            display: flex;

            align-items: stretch;
            justify-content: center;

        }


        .page {

            position: relative;

            background: #ffffff;

            overflow: hidden;

            cursor: pointer;

            flex-shrink: 0;

        }


        .page canvas {

            display: block;

            width: 100%;
            height: 100%;

        }


        /*
         * SINGLE PAGE
         */

        .page.single {

            box-shadow:
                0 5px 25px
                rgba(0, 0, 0, 0.07);

        }


        /*
         * LEFT PAGE
         */

        .page.left {

            box-shadow:

                -4px 5px 25px
                rgba(0, 0, 0, 0.055),

                inset -8px 0 15px -15px
                rgba(0, 0, 0, 0.20);

        }


        /*
         * RIGHT PAGE
         */

        .page.right {

            box-shadow:

                4px 5px 25px
                rgba(0, 0, 0, 0.055),

                inset 8px 0 15px -15px
                rgba(0, 0, 0, 0.20);

        }


        /*
         * CENTER SHADOW
         */

        .spread::after {

            content: "";

            position: absolute;

            top: 0;
            bottom: 0;

            left: 50%;

            width: 18px;

            transform:
                translateX(-50%);

            background:
                linear-gradient(
                    to right,
                    rgba(0, 0, 0, 0),
                    rgba(0, 0, 0, 0.055),
                    rgba(0, 0, 0, 0)
                );

            pointer-events: none;

            z-index: 20;

        }


        /*
         * PDF LINKS
         */

        .annotation-layer {

            position: absolute;

            inset: 0;

            z-index: 50;

            pointer-events: none;

        }


        .annotation-link {

            position: absolute;

            display: block;

            pointer-events: auto;

            cursor: pointer;

        }


        .annotation-link:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

        }


        /*
         * CONTROLS
         */

        #controls {

            position: fixed;

            left: 50%;
            bottom: 20px;

            transform:
                translateX(-50%);

            display: flex;

            align-items: center;

            gap: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            letter-spacing:
                0.12em;

            text-transform:
                uppercase;

            color: #333333;

            z-index: 100;

            user-select: none;

        }


        #controls button {

            border: none;

            background:
                transparent;

            padding: 5px;

            color: #333333;

            font-family: inherit;

            font-size: inherit;

            cursor: pointer;

        }


        #controls button:hover {

            opacity: 0.45;

        }


        #pageNumber {

            min-width: 70px;

            text-align: center;

        }


        /*
         * ZOOM CONTROLS
         */

        #zoomControls {

            position: fixed;

            right: 20px;
            bottom: 20px;

            display: flex;

            align-items: center;

            gap: 8px;

            z-index: 100;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        #zoomControls button {

            width: 28px;
            height: 28px;

            padding: 0;

            border: none;

            background: transparent;

            color: #333333;

            font-size: 16px;

            cursor: pointer;

        }


        #zoomControls button:hover {

            opacity: 0.45;

        }


        /*
         * LOADING
         */

        #loading {

            position: fixed;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            letter-spacing:
                0.15em;

            text-transform:
                uppercase;

        }


        /*
         * MOBILE
         */

        @media (
            max-width: 700px
        ) {

            #book {

                width: 96vw;

                height: 82vh;

            }


            #controls {

                bottom: 10px;

                gap: 14px;

            }


            #zoomControls {

                right: 10px;

                bottom: 10px;

            }


            .page.single,
            .page.left,
            .page.right {

                box-shadow:

                    0 5px 25px
                    rgba(0, 0, 0, 0.07);

            }

        }

    </style>

</head>


<body>


    <div id="loading">

        Loading portfolio

    </div>


    <div id="book-shell">

        <div id="book"></div>

    </div>


    <div id="controls">


        <button id="previous">

            ←

        </button>


        <span id="pageNumber">

            1 / 50

        </span>


        <button id="next">

            →

        </button>


    </div>


    <div id="zoomControls">


        <button id="zoomOut">

            −

        </button>


        <button id="zoomReset">

            1×

        </button>


        <button id="zoomIn">

            +

        </button>


    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


    <script>


        /*
         * PDF
         */

        const PDF_URL =
            "../portfolio.pdf";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


        /*
         * ELEMENTS
         */

        const loading =
            document.getElementById(
                "loading"
            );


        const book =
            document.getElementById(
                "book"
            );


        const pageNumber =
            document.getElementById(
                "pageNumber"
            );


        const previous =
            document.getElementById(
                "previous"
            );


        const next =
            document.getElementById(
                "next"
            );


        const zoomInButton =
            document.getElementById(
                "zoomIn"
            );


        const zoomOutButton =
            document.getElementById(
                "zoomOut"
            );


        const zoomResetButton =
            document.getElementById(
                "zoomReset"
            );


        /*
         * STATE
         */

        let pdf;

        let currentPage = 1;

        let changingPage = false;

        let zoomLevel = 1;

        let resizeTimer;


        /*
         * TOUCH ZOOM STATE
         */

        let pinchStartDistance = null;

        let pinchStartZoom = 1;


        /*
         * MOBILE
         */

        function isMobile() {

            return window.innerWidth <= 700;

        }


        /*
         * BASE RENDER SCALE
         *
         * The PDF is intentionally
         * rendered larger than its
         * display size.
         */

        function getRenderMultiplier() {

            if (
                isMobile()
            ) {

                /*
                 * 3x on mobile
                 */

                return 3;

            }


            /*
             * 2x on desktop
             */

            return 2;

        }


        /*
         * MAX ZOOM
         */

        function getMaxZoom() {

            if (
                isMobile()
            ) {

                return 3;

            }


            return 2.5;

        }


        /*
         * LOAD PDF
         */

        async function loadPDF() {

            try {

                pdf =
                    await pdfjsLib
                        .getDocument(
                            PDF_URL
                        )
                        .promise;


                loading.remove();


                await showPages();

            }

            catch (error) {

                loading.textContent =
                    "Error loading portfolio";

                console.error(
                    error
                );

            }

        }


        /*
         * SCALE
         *
         * This calculates the
         * visible page size.
         */

        function calculateScale(
            viewport
        ) {

            /*
             * Mobile:
             *
             * still two pages.
             */

            if (
                isMobile()
            ) {

                const maxPageWidth =
                    window.innerWidth *
                    0.47;


                const maxHeight =
                    window.innerHeight *
                    0.78;


                return Math.min(

                    maxPageWidth /
                        viewport.width,

                    maxHeight /
                        viewport.height

                );

            }


            /*
             * Desktop
             */

            const maxPageWidth =
                window.innerWidth *
                0.46;


            const maxHeight =
                window.innerHeight *
                0.86;


            return Math.min(

                maxPageWidth /
                    viewport.width,

                maxHeight /
                    viewport.height

            );

        }


        /*
         * RENDER PAGE
         */

        async function renderPage(
            pageNumberValue,
            position
        ) {

            const page =
                await pdf.getPage(
                    pageNumberValue
                );


            const baseViewport =
                page.getViewport({
                    scale: 1
                });


            /*
             * Visible size
             */

            const visibleScale =
                calculateScale(
                    baseViewport
                );


            const visibleViewport =
                page.getViewport({
                    scale:
                        visibleScale
                });


            /*
             * Render resolution
             *
             * Higher than visible size.
             */

            const renderMultiplier =
                getRenderMultiplier();


            const renderScale =
                visibleScale *
                renderMultiplier *
                zoomLevel;


            const renderViewport =
                page.getViewport({
                    scale:
                        renderScale
                });


            /*
             * Page element
             */

            const pageElement =
                document.createElement(
                    "div"
                );


            pageElement.className =
                "page " +
                position;


            /*
             * CSS display size
             */

            pageElement.style.width =
                (
                    visibleViewport.width *
                    zoomLevel
                ) +
                "px";


            pageElement.style.height =
                (
                    visibleViewport.height *
                    zoomLevel
                ) +
                "px";


            /*
             * Canvas
             */

            const canvas =
                document.createElement(
                    "canvas"
                );


            const context =
                canvas.getContext(
                    "2d"
                );


            /*
             * Physical canvas size
             */

            canvas.width =
                Math.floor(
                    renderViewport.width
                );


            canvas.height =
                Math.floor(
                    renderViewport.height
                );


            /*
             * Display canvas size
             */

            canvas.style.width =
                (
                    visibleViewport.width *
                    zoomLevel
                ) +
                "px";


            canvas.style.height =
                (
                    visibleViewport.height *
                    zoomLevel
                ) +
                "px";


            pageElement.appendChild(
                canvas
            );


            /*
             * Render
             */

            await page.render({

                canvasContext:
                    context,

                viewport:
                    renderViewport

            }).promise;


            /*
             * PDF LINKS
             */

            const annotationLayer =
                document.createElement(
                    "div"
                );


            annotationLayer.className =
                "annotation-layer";


            pageElement.appendChild(
                annotationLayer
            );


            const annotations =
                await page.getAnnotations();


            for (
                const annotation
                of annotations
            ) {


                if (
                    annotation.subtype !==
                    "Link"
                ) {

                    continue;

                }


                /*
                 * Coordinates need to use
                 * the visible scale and
                 * zoom level, not the
                 * render scale.
                 */

                const rect =
                    annotation.rect;


                const left =
                    rect[0] *
                    visibleScale *
                    zoomLevel;


                const top =
                    visibleViewport.height *
                    zoomLevel -
                    rect[3] *
                    visibleScale *
                    zoomLevel;


                const width =
                    (
                        rect[2] -
                        rect[0]
                    ) *
                    visibleScale *
                    zoomLevel;


                const height =
                    (
                        rect[3] -
                        rect[1]
                    ) *
                    visibleScale *
                    zoomLevel;


                const link =
                    document.createElement(
                        "a"
                    );


                link.className =
                    "annotation-link";


                link.style.left =
                    left + "px";


                link.style.top =
                    top + "px";


                link.style.width =
                    width + "px";


                link.style.height =
                    height + "px";


                /*
                 * EXTERNAL LINK
                 */

                if (
                    annotation.url
                ) {

                    link.href =
                        annotation.url;

                    link.target =
                        "_blank";

                    link.rel =
                        "noopener noreferrer";

                }


                /*
                 * INTERNAL LINK
                 */

                else if (
                    annotation.dest
                ) {

                    link.href =
                        "#";


                    link.addEventListener(
                        "click",
                        async function(event) {

                            event.preventDefault();

                            event.stopPropagation();


                            try {

                                const destination =
                                    await pdf
                                        .getDestination(
                                            annotation.dest
                                        );


                                if (
                                    !destination
                                ) {

                                    return;

                                }


                                const pageRef =
                                    destination[0];


                                const index =
                                    await pdf
                                        .getPageIndex(
                                            pageRef
                                        );


                                const target =
                                    index + 1;


                                await navigateTo(
                                    target
                                );

                            }

                            catch (error) {

                                console.error(
                                    "Internal PDF link error:",
                                    error
                                );

                            }

                        }
                    );

                }


                annotationLayer.appendChild(
                    link
                );

            }


            /*
             * PAGE CLICK
             */

            pageElement.addEventListener(
                "click",
                function(event) {


                    if (
                        event.target.closest(
                            ".annotation-link"
                        )
                    ) {

                        return;

                    }


                    /*
                     * Don't use page click
                     * during zoom.
                     */

                    if (
                        zoomLevel > 1 &&
                        isMobile()
                    ) {

                        return;

                    }


                    /*
                     * COVER
                     */

                    if (
                        pageNumberValue === 1
                    ) {

                        nextPage();

                        return;

                    }


                    /*
                     * BACK COVER
                     */

                    if (
                        pageNumberValue === 50
                    ) {

                        previousPage();

                        return;

                    }


                    /*
                     * LEFT PAGE
                     */

                    if (
                        pageNumberValue % 2 === 0
                    ) {

                        previousPage();

                    }


                    /*
                     * RIGHT PAGE
                     */

                    else {

                        nextPage();

                    }

                }
            );


            return pageElement;

        }


        /*
         * BUILD PAGES
         */

        async function buildPages() {


            const container =
                document.createElement(
                    "div"
                );


            /*
             * Mobile:
             *
             * still two pages.
             *
             * Cover and back cover
             * stay single.
             */

            if (
                isMobile()
            ) {

                if (
                    currentPage === 1
                ) {

                    const page =
                        await renderPage(
                            1,
                            "single"
                        );


                    container.appendChild(
                        page
                    );


                    return {

                        container:
                            container,

                        label:
                            "1 / 50"

                    };

                }


                if (
                    currentPage === 50
                ) {

                    const page =
                        await renderPage(
                            50,
                            "single"
                        );


                    container.appendChild(
                        page
                    );


                    return {

                        container:
                            container,

                        label:
                            "50 / 50"

                    };

                }


                /*
                 * Mobile spread
                 */

                container.className =
                    "spread";


                const left =
                    await renderPage(
                        currentPage,
                        "left"
                    );


                const right =
                    await renderPage(
                        currentPage + 1,
                        "right"
                    );


                container.appendChild(
                    left
                );


                container.appendChild(
                    right
                );


                return {

                    container:
                        container,

                    label:
                        currentPage +
                        "–" +
                        (
                            currentPage + 1
                        ) +
                        " / 50"

                };

            }


            /*
             * Desktop cover
             */

            if (
                currentPage === 1
            ) {

                const page =
                    await renderPage(
                        1,
                        "single"
                    );


                container.appendChild(
                    page
                );


                return {

                    container:
                        container,

                    label:
                        "1 / 50"

                };

            }


            /*
             * Desktop back cover
             */

            if (
                currentPage === 50
            ) {

                const page =
                    await renderPage(
                        50,
                        "single"
                    );


                container.appendChild(
                    page
                );


                return {

                    container:
                        container,

                    label:
                        "50 / 50"

                };

            }


            /*
             * Desktop spread
             */

            container.className =
                "spread";


            const left =
                await renderPage(
                    currentPage,
                    "left"
                );


            const right =
                await renderPage(
                    currentPage + 1,
                    "right"
                );


            container.appendChild(
                left
            );


            container.appendChild(
                right
            );


            return {

                container:
                    container,

                label:
                    currentPage +
                    "–" +
                    (
                        currentPage + 1
                    ) +
                    " / 50"

            };

        }


        /*
         * SHOW PAGES
         *
         * Render first.
         * Replace second.
         */

        async function showPages() {


            const result =
                await buildPages();


            book.replaceChildren(
                result.container
            );


            pageNumber.textContent =
                result.label;

        }


        /*
         * NAVIGATE
         */

        async function navigateTo(
            target
        ) {

            if (
                changingPage
            ) {

                return;

            }


            /*
             * Keep inside bounds
             */

            target =
                Math.max(
                    1,
                    Math.min(
                        50,
                        target
                    )
                );


            /*
             * Desktop:
             * internal links should
             * open on the correct
             * left page of a spread.
             */

            if (
                !isMobile() &&
                target !== 1 &&
                target !== 50 &&
                target % 2 !== 0
            ) {

                target--;

            }


            changingPage =
                true;


            currentPage =
                target;


            try {

                await showPages();

            }

            finally {

                changingPage =
                    false;

            }

        }


        /*
         * NEXT
         */

        async function nextPage() {


            if (
                changingPage
            ) {

                return;

            }


            if (
                isMobile()
            ) {

                if (
                    currentPage >= 50
                ) {

                    return;

                }


                currentPage += 2;


                /*
                 * If we reach page 49,
                 * display 49–50.
                 * Since 50 is the back
                 * cover, we instead
                 * stop on 48–49 and
                 * make 50 accessible
                 * only through the
                 * next click.
                 */

                if (
                    currentPage === 50
                ) {

                    currentPage = 50;

                }

            }

            else {

                if (
                    currentPage === 1
                ) {

                    currentPage = 2;

                }

                else if (
                    currentPage < 48
                ) {

                    currentPage += 2;

                }

                else {

                    currentPage = 50;

                }

            }


            changingPage =
                true;


            try {

                await showPages();

            }

            finally {

                changingPage =
                    false;

            }

        }


        /*
         * PREVIOUS
         */

        async function previousPage() {


            if (
                changingPage
            ) {

                return;

            }


            if (
                isMobile()
            ) {

                if (
                    currentPage <= 1
                ) {

                    return;

                }


                currentPage -= 2;


                if (
                    currentPage < 1
                ) {

                    currentPage = 1;

                }

            }

            else {

                if (
                    currentPage === 50
                ) {

                    currentPage = 48;

                }

                else if (
                    currentPage > 2
                ) {

                    currentPage -= 2;

                }

                else {

                    currentPage = 1;

                }

            }


            changingPage =
                true;


            try {

                await showPages();

            }

            finally {

                changingPage =
                    false;

            }

        }


        /*
         * ZOOM
         */

        async function setZoom(
            value
        ) {


            value =
                Math.max(
                    1,
                    Math.min(
                        getMaxZoom(),
                        value
                    )
                );


            zoomLevel =
                value;


            zoomResetButton.textContent =
                zoomLevel.toFixed(1) +
                "×";


            /*
             * Re-render at the
             * new resolution.
             */

            if (
                pdf
            ) {

                await showPages();

            }

        }


        /*
         * ZOOM BUTTONS
         */

        zoomInButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                setZoom(
                    zoomLevel + 0.5
                );

            }
        );


        zoomOutButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                setZoom(
                    zoomLevel - 0.5
                );

            }
        );


        zoomResetButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                setZoom(1);

            }
        );


        /*
         * TOUCH PINCH
         */

        document.addEventListener(
            "touchstart",
            function(event) {

                if (
                    event.touches.length !== 2
                ) {

                    return;

                }


                const first =
                    event.touches[0];


                const second =
                    event.touches[1];


                const dx =
                    first.clientX -
                    second.clientX;


                const dy =
                    first.clientY -
                    second.clientY;


                pinchStartDistance =
                    Math.hypot(
                        dx,
                        dy
                    );


                pinchStartZoom =
                    zoomLevel;

            },
            {
                passive: true
            }
        );


        document.addEventListener(
            "touchmove",
            function(event) {

                if (
                    event.touches.length !== 2
                ) {

                    return;

                }


                if (
                    !pinchStartDistance
                ) {

                    return;

                }


                const first =
                    event.touches[0];


                const second =
                    event.touches[1];


                const dx =
                    first.clientX -
                    second.clientX;


                const dy =
                    first.clientY -
                    second.clientY;


                const currentDistance =
                    Math.hypot(
                        dx,
                        dy
                    );


                const ratio =
                    currentDistance /
                    pinchStartDistance;


                let newZoom =
                    pinchStartZoom *
                    ratio;


                newZoom =
                    Math.max(
                        1,
                        Math.min(
                            getMaxZoom(),
                            newZoom
                        )
                    );


                /*
                 * During pinch we only
                 * resize the already
                 * rendered page.
                 *
                 * This keeps the gesture
                 * smooth.
                 */

                book.style.transform =
                    "scale(" +
                    newZoom +
                    ")";

            },
            {
                passive: true
            }
        );


        document.addEventListener(
            "touchend",
            async function(event) {

                if (
                    event.touches.length !== 0
                ) {

                    return;

                }


                if (
                    !pinchStartDistance
                ) {

                    return;

                }


                /*
                 * Read current scale
                 * from CSS transform.
                 *
                 * Simpler approach:
                 * reset transform and
                 * render at the final
                 * zoom level.
                 */

                const transform =
                    book.style.transform;


                const match =
                    transform.match(
                        /scale\(([^)]+)\)/
                    );


                if (
                    match
                ) {

                    let finalZoom =
                        parseFloat(
                            match[1]
                        );


                    finalZoom =
                        Math.max(
                            1,
                            Math.min(
                                getMaxZoom(),
                                finalZoom
                            )
                        );


                    zoomLevel =
                        finalZoom;

                }


                book.style.transform =
                    "scale(1)";


                pinchStartDistance =
                    null;


                await showPages();

            }
        );


        /*
         * PREVIOUS BUTTON
         */

        previous.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                previousPage();

            }
        );


        /*
         * NEXT BUTTON
         */

        next.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                nextPage();

            }
        );


        /*
         * KEYBOARD
         */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    nextPage();

                }


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    previousPage();

                }


                if (
                    event.key === "+"
                ) {

                    setZoom(
                        zoomLevel + 0.5
                    );

                }


                if (
                    event.key === "-"
                ) {

                    setZoom(
                        zoomLevel - 0.5
                    );

                }


                if (
                    event.key === "0"
                ) {

                    setZoom(1);

                }

            }
        );


        /*
         * RESIZE
         */

        window.addEventListener(
            "resize",
            function() {

                clearTimeout(
                    resizeTimer
                );


                resizeTimer =
                    setTimeout(
                        async function() {

                            if (
                                !pdf ||
                                changingPage
                            ) {

                                return;

                            }


                            /*
                             * Return to 1x
                             * when orientation
                             * or screen size
                             * changes significantly.
                             */

                            zoomLevel = 1;

                            zoomResetButton.textContent =
                                "1×";


                            await showPages();

                        },
                        180
                    );

            }
        );


        /*
         * START
         */

        loadPDF();


    </script>


</body>

</html>
