<!DOCTYPE html>
<html lang="sk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Matúš Blažíček — Portfolio</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #eeeeee;
        }


        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }


        #book {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 94vw;
            max-height: 90vh;
        }


        .spread {
            display: flex;
            align-items: stretch;
            justify-content: center;
        }


        .page {
            position: relative;
            background: #ffffff;
            cursor: pointer;
        }


        .page canvas {
            display: block;
        }


        .page.single {
            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.12);
        }


        .page.left {
            box-shadow:
                -4px 8px 30px rgba(0, 0, 0, 0.10),
                inset -8px 0 15px -15px rgba(0, 0, 0, 0.40);
        }


        .page.right {
            box-shadow:
                4px 8px 30px rgba(0, 0, 0, 0.10),
                inset 8px 0 15px -15px rgba(0, 0, 0, 0.40);
        }


        /*
         * PDF LINK LAYER
         */

        .annotation-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }


        .annotation-link {
            position: absolute;
            display: block;
            pointer-events: auto;
            cursor: pointer;
        }


        .annotation-link:hover {
            background: rgba(255, 255, 255, 0.08);
        }


        /*
         * NAVIGATION
         */

        #controls {
            position: fixed;
            left: 50%;
            bottom: 20px;

            transform: translateX(-50%);

            display: flex;
            align-items: center;
            gap: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            color: #333333;

            z-index: 100;
        }


        #controls button {
            border: none;
            background: transparent;

            padding: 5px;

            color: #333333;

            font-family: inherit;
            font-size: inherit;

            cursor: pointer;
        }


        #controls button:hover {
            opacity: 0.45;
        }


        #pageNumber {
            min-width: 70px;
            text-align: center;
        }


        #loading {
            position: fixed;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            letter-spacing: 0.15em;

            text-transform: uppercase;
        }


        @media (max-width: 700px) {

            #book {
                max-width: 94vw;
                max-height: 84vh;
            }


            #controls {
                bottom: 12px;
            }

        }

    </style>

</head>


<body>


    <div id="loading">
        Loading portfolio
    </div>


    <div id="book"></div>


    <div id="controls">

        <button id="previous">
            ←
        </button>


        <span id="pageNumber">
            1 / 50
        </span>


        <button id="next">
            →
        </button>

    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


    <script>

        const PDF_URL =
            "../portfolio.pdf";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


        const loading =
            document.getElementById("loading");


        const book =
            document.getElementById("book");


        const pageNumber =
            document.getElementById("pageNumber");


        const previous =
            document.getElementById("previous");


        const next =
            document.getElementById("next");


        let pdf;

        let currentPage = 1;


        /*
         * LOAD PDF
         */

        async function loadPDF() {

            try {

                pdf =
                    await pdfjsLib
                        .getDocument(PDF_URL)
                        .promise;


                loading.remove();


                await showPages();

            }

            catch (error) {

                loading.textContent =
                    "Error loading portfolio";

                console.error(error);

            }

        }


        /*
         * CALCULATE PAGE SIZE
         */

        function calculateScale(viewport) {

            const maxWidth =
                window.innerWidth * 0.46;


            const maxHeight =
                window.innerHeight * 0.86;


            return Math.min(
                maxWidth / viewport.width,
                maxHeight / viewport.height
            );

        }


        /*
         * RENDER ONE PDF PAGE
         */

        async function renderPage(
            pageNumberValue,
            position
        ) {

            const page =
                await pdf.getPage(
                    pageNumberValue
                );


            const viewport =
                page.getViewport({
                    scale: 1
                });


            const scale =
                calculateScale(
                    viewport
                );


            const scaledViewport =
                page.getViewport({
                    scale: scale
                });


            const pageElement =
                document.createElement(
                    "div"
                );


            pageElement.className =
                "page " + position;


            pageElement.style.width =
                scaledViewport.width +
                "px";


            pageElement.style.height =
                scaledViewport.height +
                "px";


            /*
             * CANVAS
             */

            const canvas =
                document.createElement(
                    "canvas"
                );


            const context =
                canvas.getContext(
                    "2d"
                );


            canvas.width =
                scaledViewport.width;


            canvas.height =
                scaledViewport.height;


            pageElement.appendChild(
                canvas
            );


            await page.render({

                canvasContext:
                    context,

                viewport:
                    scaledViewport

            }).promise;


            /*
             * ANNOTATION LAYER
             */

            const annotationLayer =
                document.createElement(
                    "div"
                );


            annotationLayer.className =
                "annotation-layer";


            pageElement.appendChild(
                annotationLayer
            );


            const annotations =
                await page.getAnnotations();


            for (
                const annotation
                of annotations
            ) {

                if (
                    annotation.subtype !==
                    "Link"
                ) {
                    continue;
                }


                const rect =
                    annotation.rect;


                const left =
                    rect[0] * scale;


                const top =
                    scaledViewport.height -
                    rect[3] * scale;


                const width =
                    (
                        rect[2] -
                        rect[0]
                    ) * scale;


                const height =
                    (
                        rect[3] -
                        rect[1]
                    ) * scale;


                const link =
                    document.createElement(
                        "a"
                    );


                link.className =
                    "annotation-link";


                link.style.left =
                    left + "px";


                link.style.top =
                    top + "px";


                link.style.width =
                    width + "px";


                link.style.height =
                    height + "px";


                /*
                 * EXTERNAL URL
                 */

                if (
                    annotation.url
                ) {

                    link.href =
                        annotation.url;

                    link.target =
                        "_blank";

                    link.rel =
                        "noopener noreferrer";

                }


                /*
                 * INTERNAL PDF LINK
                 */

                else if (
                    annotation.dest
                ) {

                    link.href =
                        "#";


                    link.addEventListener(
                        "click",
                        async function(event) {

                            event.preventDefault();

                            event.stopPropagation();


                            try {

                                const destination =
                                    await pdf
                                        .getDestination(
                                            annotation.dest
                                        );


                                if (
                                    !destination
                                ) {
                                    return;
                                }


                                const pageRef =
                                    destination[0];


                                const targetIndex =
                                    await pdf
                                        .getPageIndex(
                                            pageRef
                                        );


                                const targetPage =
                                    targetIndex + 1;


                                /*
                                 * DESTINATION:
                                 *
                                 * page 1
                                 * → cover
                                 *
                                 * page 50
                                 * → back cover
                                 *
                                 * even page
                                 * → left side
                                 *
                                 * odd page
                                 * → previous spread
                                 */

                                if (
                                    targetPage === 1
                                ) {

                                    currentPage = 1;

                                }

                                else if (
                                    targetPage === 50
                                ) {

                                    currentPage = 50;

                                }

                                else if (
                                    targetPage % 2 === 0
                                ) {

                                    currentPage =
                                        targetPage;

                                }

                                else {

                                    currentPage =
                                        targetPage - 1;

                                }


                                await showPages();

                            }

                            catch (error) {

                                console.error(
                                    "PDF link error:",
                                    error
                                );

                            }

                        }
                    );

                }


                annotationLayer.appendChild(
                    link
                );

            }


            /*
             * CLICK ON PAGE
             *
             * PDF links have their own
             * layer and therefore do not
             * trigger this navigation.
             */

            pageElement.addEventListener(
                "click",
                function(event) {

                    if (
                        event.target.closest(
                            ".annotation-link"
                        )
                    ) {
                        return;
                    }


                    const rect =
                        pageElement
                            .getBoundingClientRect();


                    const clickX =
                        event.clientX -
                        rect.left;


                    const half =
                        rect.width / 2;


                    if (
                        position === "left"
                    ) {

                        if (
                            clickX < half
                        ) {

                            previousPage();

                        }

                        else {

                            nextPage();

                        }

                    }


                    else if (
                        position === "right"
                    ) {

                        if (
                            clickX < half
                        ) {

                            previousPage();

                        }

                        else {

                            nextPage();

                        }

                    }


                    else {

                        /*
                         * SINGLE PAGE
                         */

                        if (
                            clickX <
                            rect.width / 2
                        ) {

                            previousPage();

                        }

                        else {

                            nextPage();

                        }

                    }

                }
            );


            return pageElement;

        }


        /*
         * SHOW CURRENT SPREAD
         */

        async function showPages() {

            book.innerHTML = "";


            /*
             * COVER
             */

            if (
                currentPage === 1
            ) {

                const page =
                    await renderPage(
                        1,
                        "single"
                    );


                book.appendChild(
                    page
                );


                pageNumber.textContent =
                    "1 / 50";


                return;

            }


            /*
             * BACK COVER
             */

            if (
                currentPage === 50
            ) {

                const page =
                    await renderPage(
                        50,
                        "single"
                    );


                book.appendChild(
                    page
                );


                pageNumber.textContent =
                    "50 / 50";


                return;

            }


            /*
             * NORMAL SPREAD
             */

            const spread =
                document.createElement(
                    "div"
                );


            spread.className =
                "spread";


            const left =
                await renderPage(
                    currentPage,
                    "left"
                );


            const right =
                await renderPage(
                    currentPage + 1,
                    "right"
                );


            spread.appendChild(
                left
            );


            spread.appendChild(
                right
            );


            book.appendChild(
                spread
            );


            pageNumber.textContent =
                currentPage +
                "–" +
                (
                    currentPage + 1
                ) +
                " / 50";

        }


        /*
         * NEXT
         */

        async function nextPage() {

            if (
                currentPage === 1
            ) {

                currentPage = 2;

            }

            else if (
                currentPage < 48
            ) {

                currentPage += 2;

            }

            else {

                currentPage = 50;

            }


            await showPages();

        }


        /*
         * PREVIOUS
         */

        async function previousPage() {

            if (
                currentPage === 50
            ) {

                currentPage = 48;

            }

            else if (
                currentPage > 2
            ) {

                currentPage -= 2;

            }

            else {

                currentPage = 1;

            }


            await showPages();

        }


        /*
         * BUTTONS
         */

        next.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                nextPage();

            }
        );


        previous.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                previousPage();

            }
        );


        /*
         * KEYBOARD
         */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    nextPage();

                }


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    previousPage();

                }

            }
        );


        /*
         * START
         */

        loadPDF();

    </script>


</body>

</html>
