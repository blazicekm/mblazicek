<!DOCTYPE html>
<html lang="sk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    >

    <title>Matúš Blažíček — Portfolio</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #f7f7f7;

        }


        body {

            display: flex;

            align-items: center;
            justify-content: center;

            touch-action: none;

        }


        /*
         * MAIN VIEWPORT
         */

        #book-shell {

            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

        }


        /*
         * BOOK
         */

        #book {

            position: absolute;

            left: 50%;
            top: 50%;

            display: block;

            transform:
                translate(
                    -50%,
                    -50%
                );

            transform-origin:
                center center;

            will-change:
                transform;

        }


        /*
         * SPREAD
         */

        .spread {

            display: flex;

            flex-direction: row;

            align-items: stretch;

            justify-content: center;

            width: max-content;

        }


        /*
         * PAGE
         */

        .page {

            position: relative;

            display: block;

            flex: 0 0 auto;

            background: #ffffff;

            overflow: hidden;

            cursor: pointer;

        }


        .page canvas {

            display: block;

            width: 100%;
            height: 100%;

        }


        /*
         * SINGLE PAGE
         */

        .page.single {

            box-shadow:
                0 5px 25px
                rgba(
                    0,
                    0,
                    0,
                    0.07
                );

        }


        /*
         * LEFT PAGE
         */

        .page.left {

            box-shadow:

                -4px 5px 25px
                rgba(
                    0,
                    0,
                    0,
                    0.055
                ),

                inset -8px 0 15px -15px
                rgba(
                    0,
                    0,
                    0,
                    0.20
                );

        }


        /*
         * RIGHT PAGE
         */

        .page.right {

            box-shadow:

                4px 5px 25px
                rgba(
                    0,
                    0,
                    0,
                    0.055
                ),

                inset 8px 0 15px -15px
                rgba(
                    0,
                    0,
                    0,
                    0.20
                );

        }


        /*
         * CENTER SHADOW
         */

        .spread::after {

            content: "";

            position: absolute;

            top: 0;
            bottom: 0;

            left: 50%;

            width: 18px;

            transform:
                translateX(-50%);

            background:
                linear-gradient(
                    to right,
                    rgba(
                        0,
                        0,
                        0,
                        0
                    ),
                    rgba(
                        0,
                        0,
                        0,
                        0.055
                    ),
                    rgba(
                        0,
                        0,
                        0,
                        0
                    )
                );

            pointer-events: none;

            z-index: 20;

        }


        /*
         * PDF LINKS
         */

        .annotation-layer {

            position: absolute;

            inset: 0;

            z-index: 50;

            pointer-events: none;

        }


        .annotation-link {

            position: absolute;

            display: block;

            pointer-events: auto;

            cursor: pointer;

        }


        .annotation-link:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

        }


        /*
         * CONTROLS
         */

        #controls {

            position: fixed;

            left: 50%;
            bottom: 20px;

            transform:
                translateX(-50%);

            display: flex;

            align-items: center;

            gap: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            letter-spacing:
                0.12em;

            text-transform:
                uppercase;

            color: #333333;

            z-index: 100;

            user-select: none;

        }


        #controls button {

            border: none;

            background:
                transparent;

            padding: 5px;

            color: #333333;

            font-family: inherit;

            font-size: inherit;

            cursor: pointer;

        }


        #controls button:hover {

            opacity: 0.45;

        }


        #pageNumber {

            min-width: 70px;

            text-align: center;

        }


        /*
         * ZOOM CONTROLS
         */

        #zoomControls {

            position: fixed;

            right: 20px;
            bottom: 20px;

            display: flex;

            align-items: center;

            gap: 8px;

            z-index: 100;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            user-select: none;

        }


        #zoomControls button {

            width: 28px;
            height: 28px;

            padding: 0;

            border: none;

            background:
                transparent;

            color: #333333;

            font-size: 16px;

            cursor: pointer;

        }


        #zoomControls button:hover {

            opacity: 0.45;

        }


        /*
         * LOADING
         */

        #loading {

            position: fixed;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            letter-spacing:
                0.15em;

            text-transform:
                uppercase;

        }


        /*
         * MOBILE
         */

        @media (
            max-width: 700px
        ) {

            #book {

                left: 50%;
                top: 50%;

            }


            .spread {

                width: 94vw;

            }


            .page {

                width: 47vw !important;

            }


            #controls {

                bottom: 10px;

                gap: 14px;

            }


            #zoomControls {

                right: 10px;

                bottom: 10px;

            }


            .page.single {

                width: 70vw !important;

            }


            .page.single,
            .page.left,
            .page.right {

                box-shadow:
                    0 5px 25px
                    rgba(
                        0,
                        0,
                        0,
                        0.07
                    );

            }

        }

    </style>

</head>


<body>


    <div id="loading">

        Loading portfolio

    </div>


    <div id="book-shell">

        <div id="book"></div>

    </div>


    <div id="controls">


        <button id="previous">

            ←

        </button>


        <span id="pageNumber">

            1 / 50

        </span>


        <button id="next">

            →

        </button>


    </div>


    <div id="zoomControls">


        <button id="zoomOut">

            −

        </button>


        <button id="zoomReset">

            1×

        </button>


        <button id="zoomIn">

            +

        </button>


    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


    <script>


        /*
         * PDF
         */

        const PDF_URL =
            "../portfolio.pdf";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


        /*
         * ELEMENTS
         */

        const loading =
            document.getElementById(
                "loading"
            );


        const book =
            document.getElementById(
                "book"
            );


        const bookShell =
            document.getElementById(
                "book-shell"
            );


        const pageNumber =
            document.getElementById(
                "pageNumber"
            );


        const previous =
            document.getElementById(
                "previous"
            );


        const next =
            document.getElementById(
                "next"
            );


        const zoomInButton =
            document.getElementById(
                "zoomIn"
            );


        const zoomOutButton =
            document.getElementById(
                "zoomOut"
            );


        const zoomResetButton =
            document.getElementById(
                "zoomReset"
            );


        /*
         * STATE
         */

        let pdf;

        let currentPage = 1;

        let changingPage = false;

        let zoomLevel = 1;


        /*
         * PAN
         */

        let panX = 0;

        let panY = 0;

        let dragStartX = 0;

        let dragStartY = 0;

        let dragStartPanX = 0;

        let dragStartPanY = 0;

        let dragging = false;


        /*
         * PINCH
         */

        let pinchStartDistance = null;

        let pinchStartZoom = 1;

        let pinchStartPanX = 0;

        let pinchStartPanY = 0;

        let pinchStartMidX = 0;

        let pinchStartMidY = 0;


        /*
         * RESIZE
         */

        let resizeTimer;


        /*
         * MOBILE
         */

        function isMobile() {

            return window.innerWidth <= 700;

        }


        /*
         * RENDER MULTIPLIER
         *
         * iPhone/iOS gets 2.5x.
         * This is a compromise between
         * sharpness and Safari memory usage.
         */

        function getRenderMultiplier() {

            if (
                isMobile()
            ) {

                return 2.5;

            }


            return 2;

        }


        /*
         * MAX ZOOM
         */

        function getMaxZoom() {

            if (
                isMobile()
            ) {

                return 3;

            }


            return 2.5;

        }


        /*
         * APPLY TRANSFORM
         */

        function applyTransform() {

            book.style.transform =
                "translate(" +
                (
                    -50 +
                    (
                        panX /
                        bookShell.clientWidth
                    ) *
                    100
                ) +
                "%, " +
                (
                    -50 +
                    (
                        panY /
                        bookShell.clientHeight
                    ) *
                    100
                ) +
                "%) " +
                "scale(" +
                zoomLevel +
                ")";

        }


        /*
         * CLAMP PAN
         */

        function clampPan() {


            if (
                zoomLevel <= 1
            ) {

                panX = 0;

                panY = 0;

                return;

            }


            const zoomExtra =
                zoomLevel - 1;


            const horizontalLimit =
                Math.max(
                    0,
                    (
                        bookShell.clientWidth *
                        zoomExtra
                    ) /
                    2
                );


            const verticalLimit =
                Math.max(
                    0,
                    (
                        bookShell.clientHeight *
                        zoomExtra
                    ) /
                    2
                );


            panX =
                Math.max(
                    -horizontalLimit,
                    Math.min(
                        horizontalLimit,
                        panX
                    )
                );


            panY =
                Math.max(
                    -verticalLimit,
                    Math.min(
                        verticalLimit,
                        panY
                    )
                );

        }


        /*
         * LOAD PDF
         */

        async function loadPDF() {

            try {

                pdf =
                    await pdfjsLib
                        .getDocument(
                            PDF_URL
                        )
                        .promise;


                loading.remove();


                await showPages();

            }

            catch (error) {

                loading.textContent =
                    "Error loading portfolio";

                console.error(
                    error
                );

            }

        }


        /*
         * SCALE
         */

        function calculateScale(
            viewport
        ) {

            /*
             * MOBILE
             *
             * Two pages must always
             * fit exactly across
             * the viewport.
             */

            if (
                isMobile()
            ) {

                const maxPageWidth =
                    window.innerWidth *
                    0.47;


                const maxHeight =
                    window.innerHeight *
                    0.78;


                return Math.min(

                    maxPageWidth /
                        viewport.width,

                    maxHeight /
                        viewport.height

                );

            }


            /*
             * DESKTOP
             */

            const maxPageWidth =
                window.innerWidth *
                0.46;


            const maxHeight =
                window.innerHeight *
                0.86;


            return Math.min(

                maxPageWidth /
                    viewport.width,

                maxHeight /
                    viewport.height

            );

        }


        /*
         * RENDER PAGE
         */

        async function renderPage(
            pageNumberValue,
            position
        ) {

            const page =
                await pdf.getPage(
                    pageNumberValue
                );


            const baseViewport =
                page.getViewport({
                    scale: 1
                });


            const visibleScale =
                calculateScale(
                    baseViewport
                );


            const visibleViewport =
                page.getViewport({
                    scale:
                        visibleScale
                });


            /*
             * Render resolution
             */

            const renderScale =
                visibleScale *
                getRenderMultiplier() *
                zoomLevel;


            const renderViewport =
                page.getViewport({
                    scale:
                        renderScale
                });


            /*
             * PAGE ELEMENT
             */

            const pageElement =
                document.createElement(
                    "div"
                );


            pageElement.className =
                "page " +
                position;


            pageElement.style.width =
                (
                    visibleViewport.width *
                    zoomLevel
                ) +
                "px";


            pageElement.style.height =
                (
                    visibleViewport.height *
                    zoomLevel
                ) +
                "px";


            /*
             * CANVAS
             */

            const canvas =
                document.createElement(
                    "canvas"
                );


            const context =
                canvas.getContext(
                    "2d"
                );


            /*
             * Canvas dimensions
             */

            let canvasWidth =
                Math.floor(
                    renderViewport.width
                );


            let canvasHeight =
                Math.floor(
                    renderViewport.height
                );


            /*
             * iOS safety limit
             *
             * Keep each canvas under
             * approximately 12 million
             * pixels.
             */

            const maxCanvasPixels =
                isMobile()
                    ? 12000000
                    : 18000000;


            const canvasPixels =
                canvasWidth *
                canvasHeight;


            if (
                canvasPixels >
                maxCanvasPixels
            ) {

                const reduction =
                    Math.sqrt(
                        maxCanvasPixels /
                        canvasPixels
                    );


                canvasWidth =
                    Math.floor(
                        canvasWidth *
                        reduction
                    );


                canvasHeight =
                    Math.floor(
                        canvasHeight *
                        reduction
                    );

            }


            canvas.width =
                canvasWidth;


            canvas.height =
                canvasHeight;


            /*
             * Display size
             */

            canvas.style.width =
                (
                    visibleViewport.width *
                    zoomLevel
                ) +
                "px";


            canvas.style.height =
                (
                    visibleViewport.height *
                    zoomLevel
                ) +
                "px";


            pageElement.appendChild(
                canvas
            );


            /*
             * Actual render viewport
             */

            const actualScaleX =
                canvasWidth /
                visibleViewport.width;


            const actualScaleY =
                canvasHeight /
                visibleViewport.height;


            const actualScale =
                Math.min(
                    actualScaleX,
                    actualScaleY
                );


            const actualViewport =
                page.getViewport({
                    scale:
                        actualScale
                });


            await page.render({

                canvasContext:
                    context,

                viewport:
                    actualViewport

            }).promise;


            /*
             * ANNOTATIONS
             */

            const annotationLayer =
                document.createElement(
                    "div"
                );


            annotationLayer.className =
                "annotation-layer";


            pageElement.appendChild(
                annotationLayer
            );


            const annotations =
                await page.getAnnotations();


            for (
                const annotation
                of annotations
            ) {


                if (
                    annotation.subtype !==
                    "Link"
                ) {

                    continue;

                }


                const rect =
                    annotation.rect;


                const left =
                    rect[0] *
                    visibleScale *
                    zoomLevel;


                const top =
                    visibleViewport.height *
                    zoomLevel -
                    rect[3] *
                    visibleScale *
                    zoomLevel;


                const width =
                    (
                        rect[2] -
                        rect[0]
                    ) *
                    visibleScale *
                    zoomLevel;


                const height =
                    (
                        rect[3] -
                        rect[1]
                    ) *
                    visibleScale *
                    zoomLevel;


                const link =
                    document.createElement(
                        "a"
                    );


                link.className =
                    "annotation-link";


                link.style.left =
                    left + "px";


                link.style.top =
                    top + "px";


                link.style.width =
                    width + "px";


                link.style.height =
                    height + "px";


                /*
                 * EXTERNAL LINK
                 */

                if (
                    annotation.url
                ) {

                    link.href =
                        annotation.url;

                    link.target =
                        "_blank";

                    link.rel =
                        "noopener noreferrer";

                }


                /*
                 * INTERNAL LINK
                 */

                else if (
                    annotation.dest
                ) {

                    link.href =
                        "#";


                    link.addEventListener(
                        "click",
                        async function(event) {

                            event.preventDefault();

                            event.stopPropagation();


                            try {

                                const destination =
                                    await pdf
                                        .getDestination(
                                            annotation.dest
                                        );


                                if (
                                    !destination
                                ) {

                                    return;

                                }


                                const pageRef =
                                    destination[0];


                                const index =
                                    await pdf
                                        .getPageIndex(
                                            pageRef
                                        );


                                const target =
                                    index + 1;


                                await navigateTo(
                                    target
                                );

                            }

                            catch (error) {

                                console.error(
                                    "Internal PDF link error:",
                                    error
                                );

                            }

                        }
                    );

                }


                annotationLayer.appendChild(
                    link
                );

            }


            /*
             * PAGE CLICK
             */

            pageElement.addEventListener(
                "click",
                function(event) {


                    if (
                        event.target.closest(
                            ".annotation-link"
                        )
                    ) {

                        return;

                    }


                    /*
                     * When zoomed, a click
                     * shouldn't turn into
                     * page navigation.
                     */

                    if (
                        zoomLevel > 1 &&
                        isMobile()
                    ) {

                        return;

                    }


                    /*
                     * COVER
                     */

                    if (
                        pageNumberValue === 1
                    ) {

                        nextPage();

                        return;

                    }


                    /*
                     * BACK COVER
                     */

                    if (
                        pageNumberValue === 50
                    ) {

                        previousPage();

                        return;

                    }


                    /*
                     * LEFT PAGE
                     */

                    if (
                        pageNumberValue % 2 === 0
                    ) {

                        previousPage();

                    }


                    /*
                     * RIGHT PAGE
                     */

                    else {

                        nextPage();

                    }

                }
            );


            return pageElement;

        }


        /*
         * BUILD PAGES
         */

        async function buildPages() {


            const container =
                document.createElement(
                    "div"
                );


            /*
             * COVER
             */

            if (
                currentPage === 1
            ) {

                const page =
                    await renderPage(
                        1,
                        "single"
                    );


                container.appendChild(
                    page
                );


                return {

                    container:
                        container,

                    label:
                        "1 / 50"

                };

            }


            /*
             * BACK COVER
             */

            if (
                currentPage === 50
            ) {

                const page =
                    await renderPage(
                        50,
                        "single"
                    );


                container.appendChild(
                    page
                );


                return {

                    container:
                        container,

                    label:
                        "50 / 50"

                };

            }


            /*
             * SPREAD
             */

            container.className =
                "spread";


            const left =
                await renderPage(
                    currentPage,
                    "left"
                );


            const right =
                await renderPage(
                    currentPage + 1,
                    "right"
                );


            container.appendChild(
                left
            );


            container.appendChild(
                right
            );


            return {

                container:
                    container,

                label:
                    currentPage +
                    "–" +
                    (
                        currentPage + 1
                    ) +
                    " / 50"

            };

        }


        /*
         * SHOW PAGES
         */

        async function showPages() {


            /*
             * Build first.
             *
             * The old spread remains
             * visible while PDF.js
             * renders the new spread.
             */

            const result =
                await buildPages();


            /*
             * Replace only when
             * everything is ready.
             */

            book.replaceChildren(
                result.container
            );


            pageNumber.textContent =
                result.label;


            clampPan();

            applyTransform();

        }


        /*
         * NAVIGATE TO
         */

        async function navigateTo(
            target
        ) {


            if (
                changingPage
            ) {

                return;

            }


            target =
                Math.max(
                    1,
                    Math.min(
                        50,
                        target
                    )
                );


            /*
             * Desktop:
             * internal links land on
             * the left page of a spread.
             */

            if (
                !isMobile() &&
                target !== 1 &&
                target !== 50 &&
                target % 2 !== 0
            ) {

                target--;

            }


            changingPage =
                true;


            currentPage =
                target;


            panX = 0;
            panY = 0;


            try {

                await showPages();

            }

            finally {

                changingPage =
                    false;

            }

        }


        /*
         * NEXT
         */

        async function nextPage() {


            if (
                changingPage
            ) {

                return;

            }


            if (
                currentPage === 1
            ) {

                currentPage = 2;

            }

            else if (
                currentPage < 48
            ) {

                currentPage += 2;

            }

            else {

                currentPage = 50;

            }


            panX = 0;
            panY = 0;


            changingPage =
                true;


            try {

                await showPages();

            }

            finally {

                changingPage =
                    false;

            }

        }


        /*
         * PREVIOUS
         */

        async function previousPage() {


            if (
                changingPage
            ) {

                return;

            }


            if (
                currentPage === 50
            ) {

                currentPage = 48;

            }

            else if (
                currentPage > 2
            ) {

                currentPage -= 2;

            }

            else {

                currentPage = 1;

            }


            panX = 0;
            panY = 0;


            changingPage =
                true;


            try {

                await showPages();

            }

            finally {

                changingPage =
                    false;

            }

        }


        /*
         * SET ZOOM
         */

        async function setZoom(
            value
        ) {


            value =
                Math.max(
                    1,
                    Math.min(
                        getMaxZoom(),
                        value
                    )
                );


            zoomLevel =
                value;


            if (
                zoomLevel === 1
            ) {

                panX = 0;
                panY = 0;

            }


            zoomResetButton.textContent =
                zoomLevel.toFixed(1) +
                "×";


            await showPages();

        }


        /*
         * ZOOM BUTTONS
         */

        zoomInButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                setZoom(
                    zoomLevel + 0.5
                );

            }
        );


        zoomOutButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                setZoom(
                    zoomLevel - 0.5
                );

            }
        );


        zoomResetButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                setZoom(1);

            }
        );


        /*
         * POINTER DOWN
         */

        bookShell.addEventListener(
            "pointerdown",
            function(event) {


                if (
                    zoomLevel <= 1
                ) {

                    return;

                }


                if (
                    event.target.closest(
                        "#controls"
                    ) ||
                    event.target.closest(
                        "#zoomControls"
                    )
                ) {

                    return;

                }


                dragging = true;


                dragStartX =
                    event.clientX;


                dragStartY =
                    event.clientY;


                dragStartPanX =
                    panX;


                dragStartPanY =
                    panY;


                try {

                    bookShell.setPointerCapture(
                        event.pointerId
                    );

                }

                catch (
                    error
                ) {}

            }
        );


        /*
         * POINTER MOVE
         */

        bookShell.addEventListener(
            "pointermove",
            function(event) {


                if (
                    !dragging
                ) {

                    return;

                }


                const dx =
                    event.clientX -
                    dragStartX;


                const dy =
                    event.clientY -
                    dragStartY;


                panX =
                    dragStartPanX +
                    dx;


                panY =
                    dragStartPanY +
                    dy;


                clampPan();

                applyTransform();

            }
        );


        /*
         * POINTER UP
         */

        bookShell.addEventListener(
            "pointerup",
            function(event) {

                dragging = false;


                try {

                    bookShell.releasePointerCapture(
                        event.pointerId
                    );

                }

                catch (
                    error
                ) {}

            }
        );


        /*
         * POINTER CANCEL
         */

        bookShell.addEventListener(
            "pointercancel",
            function() {

                dragging = false;

            }
        );


        /*
         * PINCH START
         */

        bookShell.addEventListener(
            "touchstart",
            function(event) {


                if (
                    event.touches.length !== 2
                ) {

                    return;

                }


                const first =
                    event.touches[0];


                const second =
                    event.touches[1];


                const dx =
                    first.clientX -
                    second.clientX;


                const dy =
                    first.clientY -
                    second.clientY;


                pinchStartDistance =
                    Math.hypot(
                        dx,
                        dy
                    );


                pinchStartZoom =
                    zoomLevel;


                pinchStartPanX =
                    panX;


                pinchStartPanY =
                    panY;


                pinchStartMidX =
                    (
                        first.clientX +
                        second.clientX
                    ) / 2;


                pinchStartMidY =
                    (
                        first.clientY +
                        second.clientY
                    ) / 2;

            },
            {
                passive: true
            }
        );


        /*
         * PINCH MOVE
         */

        bookShell.addEventListener(
            "touchmove",
            function(event) {


                if (
                    event.touches.length !== 2
                ) {

                    return;

                }


                if (
                    !pinchStartDistance
                ) {

                    return;

                }


                event.preventDefault();


                const first =
                    event.touches[0];


                const second =
                    event.touches[1];


                const dx =
                    first.clientX -
                    second.clientX;


                const dy =
                    first.clientY -
                    second.clientY;


                const distance =
                    Math.hypot(
                        dx,
                        dy
                    );


                const ratio =
                    distance /
                    pinchStartDistance;


                let newZoom =
                    pinchStartZoom *
                    ratio;


                newZoom =
                    Math.max(
                        1,
                        Math.min(
                            getMaxZoom(),
                            newZoom
                        )
                    );


                const midX =
                    (
                        first.clientX +
                        second.clientX
                    ) / 2;


                const midY =
                    (
                        first.clientY +
                        second.clientY
                    ) / 2;


                panX =
                    pinchStartPanX +
                    (
                        midX -
                        pinchStartMidX
                    );


                panY =
                    pinchStartPanY +
                    (
                        midY -
                        pinchStartMidY
                    );


                zoomLevel =
                    newZoom;


                clampPan();

                applyTransform();


                zoomResetButton.textContent =
                    zoomLevel.toFixed(1) +
                    "×";

            },
            {
                passive: false
            }
        );


        /*
         * PINCH END
         */

        bookShell.addEventListener(
            "touchend",
            async function(event) {


                if (
                    event.touches.length !== 0
                ) {

                    return;

                }


                if (
                    !pinchStartDistance
                ) {

                    return;

                }


                pinchStartDistance =
                    null;


                clampPan();

                applyTransform();


                /*
                 * Re-render at final
                 * resolution.
                 */

                await showPages();

            }
        );


        /*
         * BUTTONS
         */

        next.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                nextPage();

            }
        );


        previous.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                previousPage();

            }
        );


        /*
         * KEYBOARD
         */

        document.addEventListener(
            "keydown",
            function(event) {


                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    nextPage();

                }


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    previousPage();

                }


                if (
                    event.key === "+"
                ) {

                    setZoom(
                        zoomLevel + 0.5
                    );

                }


                if (
                    event.key === "-"
                ) {

                    setZoom(
                        zoomLevel - 0.5
                    );

                }


                if (
                    event.key === "0"
                ) {

                    setZoom(1);

                }

            }
        );


        /*
         * RESIZE
         */

        window.addEventListener(
            "resize",
            function() {

                clearTimeout(
                    resizeTimer
                );


                resizeTimer =
                    setTimeout(
                        async function() {


                            if (
                                !pdf ||
                                changingPage
                            ) {

                                return;

                            }


                            panX = 0;
                            panY = 0;


                            zoomLevel = 1;


                            zoomResetButton.textContent =
                                "1×";


                            await showPages();

                        },
                        180
                    );

            }
        );


        /*
         * START
         */

        loadPDF();


    </script>


</body>

</html>
