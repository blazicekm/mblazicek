<!DOCTYPE html>
<html lang="sk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Matúš Blažíček — Portfolio</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #f7f7f7;

        }


        body {

            display: flex;

            align-items: center;
            justify-content: center;

        }


        #book {

            position: relative;

            width: 92vw;
            height: 88vh;

            display: flex;

            align-items: center;
            justify-content: center;

        }


        .spread {

            position: relative;

            display: flex;

            align-items: stretch;
            justify-content: center;

        }


        .page {

            position: relative;

            background: #ffffff;

            overflow: hidden;

            cursor: pointer;

        }


        .page canvas {

            display: block;

            width: 100%;
            height: 100%;

        }


        /*
         * SINGLE PAGE
         */

        .page.single {

            box-shadow:
                0 5px 25px
                rgba(0, 0, 0, 0.07);

        }


        /*
         * LEFT PAGE
         */

        .page.left {

            box-shadow:

                -4px 5px 25px
                rgba(0, 0, 0, 0.055),

                inset -8px 0 15px -15px
                rgba(0, 0, 0, 0.20);

        }


        /*
         * RIGHT PAGE
         */

        .page.right {

            box-shadow:

                4px 5px 25px
                rgba(0, 0, 0, 0.055),

                inset 8px 0 15px -15px
                rgba(0, 0, 0, 0.20);

        }


        /*
         * CENTER SHADOW
         */

        .spread::after {

            content: "";

            position: absolute;

            top: 0;
            bottom: 0;

            left: 50%;

            width: 18px;

            transform:
                translateX(-50%);

            background:
                linear-gradient(
                    to right,
                    rgba(0, 0, 0, 0),
                    rgba(0, 0, 0, 0.055),
                    rgba(0, 0, 0, 0)
                );

            pointer-events: none;

            z-index: 20;

        }


        /*
         * PDF LINKS
         */

        .annotation-layer {

            position: absolute;

            inset: 0;

            z-index: 50;

            pointer-events: none;

        }


        .annotation-link {

            position: absolute;

            display: block;

            pointer-events: auto;

            cursor: pointer;

        }


        .annotation-link:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

        }


        /*
         * CONTROLS
         */

        #controls {

            position: fixed;

            left: 50%;
            bottom: 20px;

            transform:
                translateX(-50%);

            display: flex;

            align-items: center;

            gap: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            letter-spacing:
                0.12em;

            text-transform:
                uppercase;

            color: #333333;

            z-index: 100;

        }


        #controls button {

            border: none;

            background:
                transparent;

            padding: 5px;

            color: #333333;

            font-family: inherit;

            font-size: inherit;

            cursor: pointer;

        }


        #controls button:hover {

            opacity: 0.45;

        }


        #pageNumber {

            min-width: 70px;

            text-align: center;

        }


        /*
         * LOADING
         */

        #loading {

            position: fixed;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            letter-spacing:
                0.15em;

            text-transform:
                uppercase;

        }


        /*
         * MOBILE
         */

        @media (
            max-width: 700px
        ) {

            #book {

                width: 96vw;

                height: 84vh;

            }


            #controls {

                bottom: 12px;

            }

        }

    </style>

</head>


<body>


    <div id="loading">

        Loading portfolio

    </div>


    <div id="book"></div>


    <div id="controls">


        <button id="previous">

            ←

        </button>


        <span id="pageNumber">

            1 / 50

        </span>


        <button id="next">

            →

        </button>


    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


    <script>


        const PDF_URL =
            "../portfolio.pdf";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


        const loading =
            document.getElementById(
                "loading"
            );


        const book =
            document.getElementById(
                "book"
            );


        const pageNumber =
            document.getElementById(
                "pageNumber"
            );


        const previous =
            document.getElementById(
                "previous"
            );


        const next =
            document.getElementById(
                "next"
            );


        let pdf;

        let currentPage = 1;

        let changingPage = false;


        /*
         * LOAD PDF
         */

        async function loadPDF() {

            try {

                pdf =
                    await pdfjsLib
                        .getDocument(
                            PDF_URL
                        )
                        .promise;


                loading.remove();


                await showPages();

            }

            catch (error) {

                loading.textContent =
                    "Error loading portfolio";

                console.error(error);

            }

        }


        /*
         * SCALE
         */

        function calculateScale(
            viewport
        ) {

            let maxWidth;


            /*
             * SINGLE PAGE
             */

            if (
                currentPage === 1 ||
                currentPage === 50
            ) {

                maxWidth =
                    window.innerWidth *
                    0.65;

            }


            /*
             * DOUBLE PAGE
             */

            else {

                maxWidth =
                    window.innerWidth *
                    0.46;

            }


            const maxHeight =
                window.innerHeight *
                0.86;


            return Math.min(

                maxWidth /
                    viewport.width,

                maxHeight /
                    viewport.height

            );

        }


        /*
         * RENDER PAGE
         */

        async function renderPage(
            pageNumberValue,
            position
        ) {

            const page =
                await pdf.getPage(
                    pageNumberValue
                );


            const viewport =
                page.getViewport({
                    scale: 1
                });


            /*
             * LOGICAL DISPLAY SCALE
             */

            const scale =
                calculateScale(
                    viewport
                );


            const scaledViewport =
                page.getViewport({
                    scale: scale
                });


            /*
             * DEVICE PIXEL RATIO
             *
             * This is the key fix
             * for high-resolution
             * phone displays.
             */

            const devicePixelRatio =
                Math.min(
                    window.devicePixelRatio || 1,
                    3
                );


            /*
             * PAGE CONTAINER
             */

            const pageElement =
                document.createElement(
                    "div"
                );


            pageElement.className =
                "page " +
                position;


            pageElement.style.width =
                scaledViewport.width +
                "px";


            pageElement.style.height =
                scaledViewport.height +
                "px";


            /*
             * CANVAS
             *
             * Logical size stays the same.
             * Physical bitmap becomes
             * 2x–3x sharper on phones.
             */

            const canvas =
                document.createElement(
                    "canvas"
                );


            const context =
                canvas.getContext(
                    "2d"
                );


            canvas.width =
                Math.floor(
                    scaledViewport.width *
                    devicePixelRatio
                );


            canvas.height =
                Math.floor(
                    scaledViewport.height *
                    devicePixelRatio
                );


            canvas.style.width =
                scaledViewport.width +
                "px";


            canvas.style.height =
                scaledViewport.height +
                "px";


            pageElement.appendChild(
                canvas
            );


            /*
             * HIGH-DPI PDF RENDER
             */

            const renderContext = {

                canvasContext:
                    context,

                viewport:
                    scaledViewport,

                transform: [
                    devicePixelRatio,
                    0,
                    0,
                    devicePixelRatio,
                    0,
                    0
                ]

            };


            await page.render(
                renderContext
            ).promise;


            /*
             * PDF ANNOTATION LAYER
             */

            const annotationLayer =
                document.createElement(
                    "div"
                );


            annotationLayer.className =
                "annotation-layer";


            pageElement.appendChild(
                annotationLayer
            );


            const annotations =
                await page.getAnnotations();


            for (
                const annotation
                of annotations
            ) {


                if (
                    annotation.subtype !==
                    "Link"
                ) {

                    continue;

                }


                const rect =
                    annotation.rect;


                const left =
                    rect[0] *
                    scale;


                const top =
                    scaledViewport.height -
                    rect[3] *
                    scale;


                const width =
                    (
                        rect[2] -
                        rect[0]
                    ) *
                    scale;


                const height =
                    (
                        rect[3] -
                        rect[1]
                    ) *
                    scale;


                const link =
                    document.createElement(
                        "a"
                    );


                link.className =
                    "annotation-link";


                link.style.left =
                    left + "px";


                link.style.top =
                    top + "px";


                link.style.width =
                    width + "px";


                link.style.height =
                    height + "px";


                /*
                 * EXTERNAL LINK
                 */

                if (
                    annotation.url
                ) {

                    link.href =
                        annotation.url;

                    link.target =
                        "_blank";

                    link.rel =
                        "noopener noreferrer";

                }


                /*
                 * INTERNAL PDF LINK
                 */

                else if (
                    annotation.dest
                ) {

                    link.href =
                        "#";


                    link.addEventListener(
                        "click",
                        async function(event) {

                            event.preventDefault();

                            event.stopPropagation();


                            try {

                                const destination =
                                    await pdf
                                        .getDestination(
                                            annotation.dest
                                        );


                                if (
                                    !destination
                                ) {

                                    return;

                                }


                                const pageRef =
                                    destination[0];


                                const index =
                                    await pdf
                                        .getPageIndex(
                                            pageRef
                                        );


                                const target =
                                    index + 1;


                                if (
                                    target === 1
                                ) {

                                    await navigateTo(
                                        1
                                    );

                                }

                                else if (
                                    target === 50
                                ) {

                                    await navigateTo(
                                        50
                                    );

                                }

                                else if (
                                    target % 2 === 0
                                ) {

                                    await navigateTo(
                                        target
                                    );

                                }

                                else {

                                    await navigateTo(
                                        target - 1
                                    );

                                }

                            }

                            catch (error) {

                                console.error(
                                    "Internal PDF link error:",
                                    error
                                );

                            }

                        }
                    );

                }


                annotationLayer.appendChild(
                    link
                );

            }


            /*
             * PAGE CLICK
             */

            pageElement.addEventListener(
                "click",
                function(event) {


                    if (
                        event.target.closest(
                            ".annotation-link"
                        )
                    ) {

                        return;

                    }


                    /*
                     * FIRST PAGE
                     */

                    if (
                        pageNumberValue === 1
                    ) {

                        nextPage();

                        return;

                    }


                    /*
                     * LAST PAGE
                     */

                    if (
                        pageNumberValue === 50
                    ) {

                        previousPage();

                        return;

                    }


                    /*
                     * LEFT PAGE
                     */

                    if (
                        pageNumberValue % 2 === 0
                    ) {

                        previousPage();

                    }


                    /*
                     * RIGHT PAGE
                     */

                    else {

                        nextPage();

                    }

                }
            );


            return pageElement;

        }


        /*
         * BUILD NEXT VIEW
         */

        async function buildPages() {

            const container =
                document.createElement(
                    "div"
                );


            /*
             * COVER
             */

            if (
                currentPage === 1
            ) {

                const page =
                    await renderPage(
                        1,
                        "single"
                    );


                container.appendChild(
                    page
                );


                return {

                    container:
                        container,

                    label:
                        "1 / 50"

                };

            }


            /*
             * BACK COVER
             */

            if (
                currentPage === 50
            ) {

                const page =
                    await renderPage(
                        50,
                        "single"
                    );


                container.appendChild(
                    page
                );


                return {

                    container:
                        container,

                    label:
                        "50 / 50"

                };

            }


            /*
             * SPREAD
             */

            container.className =
                "spread";


            const left =
                await renderPage(
                    currentPage,
                    "left"
                );


            const right =
                await renderPage(
                    currentPage + 1,
                    "right"
                );


            container.appendChild(
                left
            );


            container.appendChild(
                right
            );


            return {

                container:
                    container,

                label:
                    currentPage +
                    "–" +
                    (
                        currentPage + 1
                    ) +
                    " / 50"

            };

        }


        /*
         * SHOW PAGES
         */

        async function showPages() {

            const result =
                await buildPages();


            /*
             * Old page stays visible
             * until the new one is
             * completely rendered.
             */

            book.replaceChildren(
                result.container
            );


            pageNumber.textContent =
                result.label;

        }


        /*
         * NAVIGATE TO
         */

        async function navigateTo(
            target
        ) {

            if (
                changingPage
            ) {

                return;

            }


            changingPage =
                true;


            currentPage =
                target;


            try {

                await showPages();

            }

            finally {

                changingPage =
                    false;

            }

        }


        /*
         * NEXT
         */

        async function nextPage() {

            if (
                changingPage
            ) {

                return;

            }


            changingPage =
                true;


            try {

                if (
                    currentPage === 1
                ) {

                    currentPage = 2;

                }

                else if (
                    currentPage < 48
                ) {

                    currentPage += 2;

                }

                else {

                    currentPage = 50;

                }


                await showPages();

            }

            finally {

                changingPage =
                    false;

            }

        }


        /*
         * PREVIOUS
         */

        async function previousPage() {

            if (
                changingPage
            ) {

                return;

            }


            changingPage =
                true;


            try {

                if (
                    currentPage === 50
                ) {

                    currentPage = 48;

                }

                else if (
                    currentPage > 2
                ) {

                    currentPage -= 2;

                }

                else {

                    currentPage = 1;

                }


                await showPages();

            }

            finally {

                changingPage =
                    false;

            }

        }


        /*
         * BUTTONS
         */

        next.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                nextPage();

            }
        );


        previous.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                previousPage();

            }
        );


        /*
         * KEYBOARD
         */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    nextPage();

                }


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    previousPage();

                }

            }
        );


        /*
         * RESIZE
         */

        let resizeTimer;


        window.addEventListener(
            "resize",
            function() {

                clearTimeout(
                    resizeTimer
                );


                resizeTimer =
                    setTimeout(
                        async function() {

                            if (
                                !pdf ||
                                changingPage
                            ) {

                                return;

                            }


                            await showPages();

                        },
                        150
                    );

            }
        );


        /*
         * START
         */

        loadPDF();


    </script>


</body>

</html>
