<!DOCTYPE html>
<html lang="sk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Matúš Blažíček — Portfolio</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #eeeeee;
        }


        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }


        #book {
            position: relative;

            width: 92vw;
            height: 88vh;

            display: flex;
            align-items: center;
            justify-content: center;

            perspective: 2200px;
        }


        /*
         * SPREAD
         */

        .spread {

            position: relative;

            display: flex;

            align-items: stretch;
            justify-content: center;

            transform-style: preserve-3d;

        }


        /*
         * PAGE
         */

        .page {

            position: relative;

            background: #ffffff;

            overflow: hidden;

            transform-style: preserve-3d;

            cursor: pointer;

        }


        .page canvas {

            display: block;

            width: 100%;
            height: 100%;

        }


        /*
         * PAGE SHADOWS
         */

        .page.single {

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.14);

        }


        .page.left {

            box-shadow:
                -5px 10px 35px
                rgba(0, 0, 0, 0.10),

                inset -10px 0 18px -15px
                rgba(0, 0, 0, 0.45);

        }


        .page.right {

            box-shadow:
                5px 10px 35px
                rgba(0, 0, 0, 0.10),

                inset 10px 0 18px -15px
                rgba(0, 0, 0, 0.45);

        }


        /*
         * CENTER BOOK SHADOW
         */

        .spread::after {

            content: "";

            position: absolute;

            top: 0;
            bottom: 0;

            left: 50%;

            width: 18px;

            transform:
                translateX(-50%);

            background:
                linear-gradient(
                    to right,
                    rgba(0,0,0,0.00),
                    rgba(0,0,0,0.10),
                    rgba(0,0,0,0.00)
                );

            pointer-events: none;

            z-index: 20;

        }


        /*
         * ANIMATION
         */

        .page.flip-left {

            transform-origin: right center;

            animation:
                flipLeft
                0.75s
                cubic-bezier(
                    0.4,
                    0,
                    0.2,
                    1
                );

        }


        .page.flip-right {

            transform-origin: left center;

            animation:
                flipRight
                0.75s
                cubic-bezier(
                    0.4,
                    0,
                    0.2,
                    1
                );

        }


        @keyframes flipLeft {

            0% {

                transform:
                    rotateY(0deg);

            }

            100% {

                transform:
                    rotateY(-180deg);

            }

        }


        @keyframes flipRight {

            0% {

                transform:
                    rotateY(0deg);

            }

            100% {

                transform:
                    rotateY(180deg);

            }

        }


        /*
         * LINK LAYER
         */

        .annotation-layer {

            position: absolute;

            inset: 0;

            z-index: 50;

            pointer-events: none;

        }


        .annotation-link {

            position: absolute;

            display: block;

            pointer-events: auto;

            cursor: pointer;

        }


        .annotation-link:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

        }


        /*
         * CONTROLS
         */

        #controls {

            position: fixed;

            left: 50%;
            bottom: 20px;

            transform:
                translateX(-50%);

            display: flex;

            align-items: center;

            gap: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            letter-spacing:
                0.12em;

            text-transform:
                uppercase;

            color: #333333;

            z-index: 100;

        }


        #controls button {

            border: none;

            background:
                transparent;

            padding: 5px;

            color: inherit;

            font-family: inherit;

            font-size: inherit;

            cursor: pointer;

        }


        #controls button:hover {

            opacity: 0.45;

        }


        #pageNumber {

            min-width: 70px;

            text-align: center;

        }


        /*
         * LOADING
         */

        #loading {

            position: fixed;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            letter-spacing:
                0.15em;

            text-transform:
                uppercase;

        }


        /*
         * MOBILE
         */

        @media (
            max-width: 700px
        ) {

            #book {

                width: 94vw;

                height: 84vh;

            }


            #controls {

                bottom: 12px;

            }

        }

    </style>

</head>


<body>


    <div id="loading">

        Loading portfolio

    </div>


    <div id="book"></div>


    <div id="controls">


        <button id="previous">

            ←

        </button>


        <span id="pageNumber">

            1 / 50

        </span>


        <button id="next">

            →

        </button>


    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


    <script>


        const PDF_URL =
            "../portfolio.pdf";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


        const loading =
            document.getElementById(
                "loading"
            );


        const book =
            document.getElementById(
                "book"
            );


        const pageNumber =
            document.getElementById(
                "pageNumber"
            );


        const previous =
            document.getElementById(
                "previous"
            );


        const next =
            document.getElementById(
                "next"
            );


        let pdf;

        let currentPage = 1;

        let animating = false;


        /*
         * LOAD PDF
         */

        async function loadPDF() {

            try {

                pdf =
                    await pdfjsLib
                        .getDocument(
                            PDF_URL
                        )
                        .promise;


                loading.remove();


                await showPages();

            }

            catch (error) {

                loading.textContent =
                    "Error loading portfolio";

                console.error(error);

            }

        }


        /*
         * SCALE
         */

        function calculateScale(
            viewport
        ) {

            let maxWidth;

            /*
             * SINGLE PAGE
             */

            if (
                currentPage === 1 ||
                currentPage === 50
            ) {

                maxWidth =
                    window.innerWidth *
                    0.65;

            }

            /*
             * SPREAD
             */

            else {

                maxWidth =
                    window.innerWidth *
                    0.46;

            }


            const maxHeight =
                window.innerHeight *
                0.86;


            return Math.min(

                maxWidth /
                    viewport.width,

                maxHeight /
                    viewport.height

            );

        }


        /*
         * RENDER PAGE
         */

        async function renderPage(
            pageNumberValue,
            position
        ) {

            const page =
                await pdf.getPage(
                    pageNumberValue
                );


            const viewport =
                page.getViewport({
                    scale: 1
                });


            const scale =
                calculateScale(
                    viewport
                );


            const scaledViewport =
                page.getViewport({
                    scale:
                        scale
                });


            const pageElement =
                document.createElement(
                    "div"
                );


            pageElement.className =
                "page " +
                position;


            pageElement.style.width =
                scaledViewport.width +
                "px";


            pageElement.style.height =
                scaledViewport.height +
                "px";


            const canvas =
                document.createElement(
                    "canvas"
                );


            const context =
                canvas.getContext(
                    "2d"
                );


            canvas.width =
                scaledViewport.width;


            canvas.height =
                scaledViewport.height;


            pageElement.appendChild(
                canvas
            );


            await page.render({

                canvasContext:
                    context,

                viewport:
                    scaledViewport

            }).promise;


            /*
             * PDF LINKS
             */

            const annotationLayer =
                document.createElement(
                    "div"
                );


            annotationLayer.className =
                "annotation-layer";


            pageElement.appendChild(
                annotationLayer
            );


            const annotations =
                await page.getAnnotations();


            for (
                const annotation
                of annotations
            ) {


                if (
                    annotation.subtype !==
                    "Link"
                ) {

                    continue;

                }


                const rect =
                    annotation.rect;


                const left =
                    rect[0] *
                    scale;


                const top =
                    scaledViewport.height -
                    rect[3] *
                    scale;


                const width =
                    (
                        rect[2] -
                        rect[0]
                    ) *
                    scale;


                const height =
                    (
                        rect[3] -
                        rect[1]
                    ) *
                    scale;


                const link =
                    document.createElement(
                        "a"
                    );


                link.className =
                    "annotation-link";


                link.style.left =
                    left + "px";


                link.style.top =
                    top + "px";


                link.style.width =
                    width + "px";


                link.style.height =
                    height + "px";


                /*
                 * EXTERNAL LINK
                 */

                if (
                    annotation.url
                ) {

                    link.href =
                        annotation.url;

                    link.target =
                        "_blank";

                    link.rel =
                        "noopener noreferrer";

                }


                /*
                 * INTERNAL PDF LINK
                 */

                else if (
                    annotation.dest
                ) {

                    link.href =
                        "#";


                    link.addEventListener(
                        "click",
                        async function(event) {

                            event.preventDefault();

                            event.stopPropagation();


                            try {

                                const destination =
                                    await pdf
                                        .getDestination(
                                            annotation.dest
                                        );


                                if (
                                    !destination
                                ) {

                                    return;

                                }


                                const pageRef =
                                    destination[0];


                                const index =
                                    await pdf
                                        .getPageIndex(
                                            pageRef
                                        );


                                const target =
                                    index + 1;


                                /*
                                 * COVER
                                 */

                                if (
                                    target === 1
                                ) {

                                    await navigateTo(
                                        1
                                    );

                                    return;

                                }


                                /*
                                 * BACK COVER
                                 */

                                if (
                                    target === 50
                                ) {

                                    await navigateTo(
                                        50
                                    );

                                    return;

                                }


                                /*
                                 * NORMAL SPREAD
                                 */

                                if (
                                    target % 2 === 0
                                ) {

                                    await navigateTo(
                                        target
                                    );

                                }

                                else {

                                    await navigateTo(
                                        target - 1
                                    );

                                }

                            }

                            catch (error) {

                                console.error(
                                    error
                                );

                            }

                        }
                    );

                }


                annotationLayer.appendChild(
                    link
                );

            }


            /*
             * CLICK NAVIGATION
             */

            pageElement.addEventListener(
                "click",
                function(event) {


                    if (
                        event.target.closest(
                            ".annotation-link"
                        )
                    ) {

                        return;

                    }


                    /*
                     * COVER
                     */

                    if (
                        pageNumberValue === 1
                    ) {

                        nextPage();

                        return;

                    }


                    /*
                     * BACK COVER
                     */

                    if (
                        pageNumberValue === 50
                    ) {

                        previousPage();

                        return;

                    }


                    /*
                     * LEFT PAGE
                     */

                    if (
                        pageNumberValue % 2 === 0
                    ) {

                        previousPage();

                    }


                    /*
                     * RIGHT PAGE
                     */

                    else {

                        nextPage();

                    }

                }
            );


            return pageElement;

        }


        /*
         * SHOW PAGES
         */

        async function showPages() {


            book.innerHTML = "";


            /*
             * COVER
             */

            if (
                currentPage === 1
            ) {

                const page =
                    await renderPage(
                        1,
                        "single"
                    );


                book.appendChild(
                    page
                );


                pageNumber.textContent =
                    "1 / 50";


                return;

            }


            /*
             * BACK COVER
             */

            if (
                currentPage === 50
            ) {

                const page =
                    await renderPage(
                        50,
                        "single"
                    );


                book.appendChild(
                    page
                );


                pageNumber.textContent =
                    "50 / 50";


                return;

            }


            /*
             * SPREAD
             */

            const spread =
                document.createElement(
                    "div"
                );


            spread.className =
                "spread";


            const left =
                await renderPage(
                    currentPage,
                    "left"
                );


            const right =
                await renderPage(
                    currentPage + 1,
                    "right"
                );


            spread.appendChild(
                left
            );


            spread.appendChild(
                right
            );


            book.appendChild(
                spread
            );


            pageNumber.textContent =
                currentPage +
                "–" +
                (
                    currentPage + 1
                ) +
                " / 50";

        }


        /*
         * NAVIGATE
         */

        async function navigateTo(
            target
        ) {

            if (
                animating
            ) {

                return;

            }


            currentPage =
                target;


            await showPages();

        }


        /*
         * NEXT
         */

        async function nextPage() {


            if (
                animating
            ) {

                return;

            }


            animating = true;


            /*
             * COVER → SPREAD
             */

            if (
                currentPage === 1
            ) {

                const oldPage =
                    book.querySelector(
                        ".page"
                    );


                if (
                    oldPage
                ) {

                    oldPage.classList.add(
                        "flip-right"
                    );


                    await sleep(
                        650
                    );

                }


                currentPage = 2;


                await showPages();

            }


            /*
             * SPREAD → NEXT SPREAD
             */

            else if (
                currentPage < 48
            ) {

                const rightPage =
                    book.querySelector(
                        ".page.right"
                    );


                if (
                    rightPage
                ) {

                    rightPage.classList.add(
                        "flip-right"
                    );


                    await sleep(
                        650
                    );

                }


                currentPage += 2;


                await showPages();

            }


            /*
             * LAST PAGE
             */

            else {

                const rightPage =
                    book.querySelector(
                        ".page.right"
                    );


                if (
                    rightPage
                ) {

                    rightPage.classList.add(
                        "flip-right"
                    );


                    await sleep(
                        650
                    );

                }


                currentPage = 50;


                await showPages();

            }


            animating = false;

        }


        /*
         * PREVIOUS
         */

        async function previousPage() {


            if (
                animating
            ) {

                return;

            }


            animating = true;


            /*
             * BACK COVER → SPREAD
             */

            if (
                currentPage === 50
            ) {

                const oldPage =
                    book.querySelector(
                        ".page"
                    );


                if (
                    oldPage
                ) {

                    oldPage.classList.add(
                        "flip-left"
                    );


                    await sleep(
                        650
                    );

                }


                currentPage = 48;


                await showPages();

            }


            /*
             * SPREAD → PREVIOUS SPREAD
             */

            else if (
                currentPage > 2
            ) {

                const leftPage =
                    book.querySelector(
                        ".page.left"
                    );


                if (
                    leftPage
                ) {

                    leftPage.classList.add(
                        "flip-left"
                    );


                    await sleep(
                        650
                    );

                }


                currentPage -= 2;


                await showPages();

            }


            /*
             * SPREAD → COVER
             */

            else {

                const leftPage =
                    book.querySelector(
                        ".page.left"
                    );


                if (
                    leftPage
                ) {

                    leftPage.classList.add(
                        "flip-left"
                    );


                    await sleep(
                        650
                    );

                }


                currentPage = 1;


                await showPages();

            }


            animating = false;

        }


        /*
         * SLEEP
         */

        function sleep(
            milliseconds
        ) {

            return new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        milliseconds
                    )
            );

        }


        /*
         * BUTTONS
         */

        next.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                nextPage();

            }
        );


        previous.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                previousPage();

            }
        );


        /*
         * KEYBOARD
         */

        document.addEventListener(
            "keydown",
            function(event) {


                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    nextPage();

                }


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    previousPage();

                }

            }
        );


        /*
         * START
         */

        loadPDF();


    </script>


</body>

</html>
